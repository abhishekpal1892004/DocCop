name: MediBook Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax & startup validation
        run: node --check src/server.js && node --check src/workers/notification.worker.js

      - name: Run automated unit & integration tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/medibook_ci
        run: node --test

      - name: Dependency security audit
        run: npm audit --audit-level=high
